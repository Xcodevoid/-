<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刘雨晴 · 生日祝福墙</title>
<style>
  :root{
    --night-1:#2E1748;
    --night-2:#180B29;
    --gold:#FFD26A;
    --gold-deep:#C98F2B;
    --pink:#FF5FA2;
    --violet:#A96BFF;
    --cream:#FFF8EE;
    --ink:#3A2B33;
    --ink-soft:#8C7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;color:#F2E7F5;
    background:
      radial-gradient(70% 45% at 50% 0%, rgba(255,210,106,.18), transparent 60%),
      radial-gradient(60% 45% at 85% 80%, rgba(255,95,162,.16), transparent 65%),
      radial-gradient(55% 45% at 10% 65%, rgba(169,107,255,.14), transparent 65%),
      linear-gradient(180deg,var(--night-1),var(--night-2));
    background-attachment:fixed;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* ---------- 气球 ---------- */
  .balloons{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .balloon{position:absolute;width:82px;height:102px;
    border-radius:50% 50% 48% 48% / 56% 56% 44% 44%;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.75) 0 6%, transparent 32%),
      linear-gradient(115deg, rgba(255,255,255,.42) 0 14%, transparent 26%, rgba(0,0,0,.18) 54%, rgba(255,255,255,.3) 70%, transparent 86%),
      var(--c,#FFD26A);
    box-shadow:0 14px 34px rgba(0,0,0,.42);
    animation:float 7s ease-in-out infinite;}
  .balloon::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--c,#FFD26A);}
  .balloon::before{content:"";position:absolute;left:50%;top:100%;width:34px;height:150px;
    margin-top:6px;transform:translateX(-58%);
    border-left:1.5px solid rgba(255,255,255,.28);
    border-radius:0 0 0 70%;}
  .b1{left:2%;top:16%;--c:var(--gold);animation-delay:-1s;}
  .b2{left:8%;top:44%;--c:var(--pink);width:62px;height:78px;animation-delay:-3.4s;}
  .b3{right:3%;top:12%;--c:var(--violet);animation-delay:-2.2s;}
  .b4{right:8%;top:46%;--c:var(--gold);width:58px;height:72px;animation-delay:-5s;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-16px) rotate(2deg);}}
  @media(max-width:900px){.b2,.b4{display:none;}.balloon{opacity:.55;}}

  .wrap{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:44px 18px 80px;}

  /* ---------- 标题 ---------- */
  .head{text-align:center;margin-bottom:26px;}
  .ribbon{font-size:13px;letter-spacing:.42em;color:var(--gold);margin:0 0 10px;text-indent:.42em;}
  h1{margin:0;font-family:"Songti SC","STSong","SimSun",Georgia,serif;
    font-size:clamp(38px,8vw,74px);font-weight:700;letter-spacing:.06em;line-height:1.15;
    background:linear-gradient(180deg,#FFF6DF 8%,var(--gold) 46%,var(--gold-deep) 74%,#FFE9B6 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 10px rgba(255,190,80,.35));}
  .sub{margin:12px 0 0;font-size:15px;color:#D3C0DE;letter-spacing:.06em;}
  .sub b{color:var(--gold);font-weight:600;}

  .actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
  button{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:999px;transition:.16s;}
  .btn-main{padding:14px 32px;font-size:16px;font-weight:700;color:#3D2606;
    background:linear-gradient(180deg,#FFEEC4,var(--gold) 55%,#E8A93C);
    box-shadow:0 10px 28px rgba(255,180,70,.34);}
  .btn-main:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .btn-ghost{padding:13px 22px;font-size:14px;color:#E1D2EA;background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.18);}
  .btn-ghost:hover{background:rgba(255,255,255,.15);}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- 亮片幕布 ---------- */
  .stage{position:relative;border-radius:10px;overflow:hidden;min-height:540px;
    box-shadow:0 30px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.1);
    transition:height .25s;}
  .curtain{position:absolute;inset:0;z-index:0;
    background:
      repeating-linear-gradient(90deg,
        rgba(255,210,106,.34) 0 8px,
        rgba(120,60,30,.30) 8px 15px,
        rgba(255,240,190,.20) 15px 21px,
        rgba(80,40,20,.34) 21px 30px),
      linear-gradient(180deg,#6A3B6E,#39184A 55%,#20102F);}
  .curtain::after{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.16) 46%,rgba(255,255,255,.05) 54%,transparent 66%);
    background-size:260% 100%;animation:sheen 9s linear infinite;}
  @keyframes sheen{0%{background-position:180% 0;}100%{background-position:-80% 0;}}
  .dim{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(85% 70% at 50% 30%, rgba(20,8,32,.30), rgba(16,6,26,.72));}

  /* ---------- 顶部彩带 ---------- */
  .streamers{position:absolute;left:0;right:0;top:0;height:120px;z-index:2;pointer-events:none;
    display:flex;justify-content:space-around;}
  .streamer{width:11px;border-radius:0 0 6px 6px;opacity:.9;
    background:repeating-linear-gradient(165deg,var(--s1) 0 12px,var(--s2) 12px 24px);
    box-shadow:0 4px 10px rgba(0,0,0,.3);}
  .streamer:nth-child(odd){--s1:var(--gold);--s2:#E8A93C;}
  .streamer:nth-child(even){--s1:var(--pink);--s2:#C93C79;}
  .streamer:nth-child(3n){--s1:var(--violet);--s2:#7B44C4;}
  .streamer:nth-child(1){height:88px;}
  .streamer:nth-child(2){height:54px;}
  .streamer:nth-child(3){height:104px;}
  .streamer:nth-child(4){height:66px;}
  .streamer:nth-child(5){height:94px;}
  .streamer:nth-child(6){height:48px;}
  .streamer:nth-child(7){height:80px;}
  .streamer:nth-child(8){height:60px;}

  /* ---------- 便签 ---------- */
  .note{position:absolute;z-index:5;width:210px;min-height:172px;padding:30px 18px 16px;
    background:linear-gradient(180deg,#FFFDF8,var(--cream));color:var(--ink);border-radius:3px;
    box-shadow:0 12px 28px rgba(10,2,20,.5);
    transform:rotate(var(--rot,0deg));transition:box-shadow .18s,transform .18s;touch-action:none;}
  .note::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:var(--tab,var(--gold));}
  .note:hover{box-shadow:0 16px 36px rgba(10,2,20,.58), 0 0 24px var(--glow,rgba(255,210,106,.3));}
  .note.dragging{transform:rotate(0deg) scale(1.05);z-index:99;
    box-shadow:0 24px 48px rgba(0,0,0,.65), 0 0 40px var(--glow,rgba(255,210,106,.5));}
  .note .pin{position:absolute;left:50%;top:-10px;transform:translateX(-50%);
    width:20px;height:20px;border-radius:50%;cursor:grab;
    background:radial-gradient(circle at 34% 30%, #FFFDF2 0 3px, var(--tab,var(--gold)) 4px 66%, rgba(0,0,0,.45));
    box-shadow:0 3px 8px rgba(0,0,0,.5), 0 0 14px var(--glow,rgba(255,210,106,.6));}
  .note p{margin:0 0 14px;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
    font-size:19px;line-height:1.8;white-space:pre-wrap;word-break:break-word;}
  .note p.long{font-size:16.5px;line-height:1.72;}
  .note .sign-line{display:block;text-align:right;font-size:13px;color:var(--ink-soft);letter-spacing:.04em;}
  .note .del{position:absolute;right:6px;top:11px;padding:2px 9px;font-size:12px;
    background:rgba(58,43,51,.1);color:#7A6270;border-radius:999px;opacity:0;transition:.15s;}
  .note:hover .del,.note .del:focus-visible{opacity:1;}
  .note .del:hover{background:rgba(255,95,162,.3);}

  .empty{position:absolute;z-index:5;left:50%;top:52%;transform:translate(-50%,-50%);text-align:center;
    font-family:"Kaiti SC","STKaiti",serif;font-size:20px;line-height:2.1;color:#E7D6EE;
    text-shadow:0 2px 8px rgba(0,0,0,.6);}

  /* ---------- 纸屑 ---------- */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
  .bit{position:absolute;width:9px;height:14px;opacity:0;}
  @keyframes fall{
    0%{opacity:1;transform:translate(0,0) rotate(0deg);}
    100%{opacity:0;transform:translate(var(--dx),105vh) rotate(var(--spin));}}

  /* ---------- 一列 / 打印 ---------- */
  body.flow .stage{height:auto !important;padding:30px 16px;}
  body.flow .streamers{position:static;height:80px;margin:-30px -16px 18px;}
  body.flow .note{position:static !important;width:auto;max-width:560px;margin:0 auto 20px;}
  body.flow .note .pin{cursor:default;}
  body.flow .empty{position:static;transform:none;padding:70px 0;}

  /* ---------- 弹窗 ---------- */
  .mask{position:fixed;inset:0;background:rgba(12,4,22,.76);backdrop-filter:blur(5px);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:90;}
  .mask.on{display:flex;}
  .dialog{width:100%;max-width:430px;border-radius:16px;padding:24px;
    background:linear-gradient(180deg,#44265B,#2A1440);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 0 60px rgba(255,190,90,.12),0 30px 70px rgba(0,0,0,.6);}
  .dialog h2{margin:0 0 4px;font-family:"Songti SC","STSong",serif;font-size:21px;
    letter-spacing:.06em;color:#FFEFCF;}
  .dialog .hint{margin:0 0 14px;font-size:13px;color:#BCA8CA;line-height:1.7;}
  label{display:block;font-size:13px;color:#CDBBD9;margin:16px 0 6px;}
  input,textarea{width:100%;padding:11px 13px;border-radius:9px;font:inherit;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#F7F0FA;}
  input:focus,textarea:focus{border-color:var(--gold);}
  textarea{min-height:112px;resize:vertical;line-height:1.7;}
  input::placeholder,textarea::placeholder{color:#9182A0;}
  input:disabled{opacity:.45;}
  .swatches{display:flex;gap:10px;}
  .swatch{width:34px;height:34px;border-radius:8px;padding:0;border:2px solid transparent;cursor:pointer;}
  .swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 16px currentColor;}
  .anon{display:flex;align-items:flex-start;gap:10px;margin-top:18px;padding:12px 14px;
    background:rgba(255,255,255,.06);border-radius:10px;cursor:pointer;}
  .anon input{width:17px;height:17px;flex:none;margin-top:2px;accent-color:var(--gold);}
  .anon span{font-size:14px;color:#DDCEE6;line-height:1.6;}
  .anon small{display:block;color:#A08FAE;font-size:12px;margin-top:3px;}
  .err{color:#FF9CC1;font-size:13px;margin-top:10px;min-height:18px;}
  .dialog .row{display:flex;gap:10px;margin-top:18px;}
  .dialog .row button{flex:1;padding:12px;}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
    background:linear-gradient(180deg,#FFEEC4,var(--gold));color:#3D2606;
    padding:12px 24px;border-radius:999px;font-size:14px;font-weight:600;
    box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.22s;z-index:95;}
  .toast.on{opacity:1;transform:translate(-50%,0);}
  .banner{max-width:620px;margin:0 auto 18px;padding:11px 16px;border-radius:10px;font-size:14px;
    background:rgba(255,95,162,.14);border:1px solid rgba(255,95,162,.4);color:#FFC8DD;text-align:center;}
  .tip{text-align:center;font-size:13px;color:#9C8AAA;margin:18px 0 0;}

  @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

  @media print{
    body{background:#fff;color:#000;}
    .balloons,.streamers,.curtain,.dim,.actions,.del,.toast,.mask,.tip,.banner,.confetti{display:none !important;}
    .stage{box-shadow:none;background:#fff;}
    h1{color:#000;-webkit-text-fill-color:#000;}
    .note{box-shadow:none;border:1px solid #E3D8C6;}
  }
</style>

<div class="balloons" aria-hidden="true">
  <span class="balloon b1"></span><span class="balloon b2"></span>
  <span class="balloon b3"></span><span class="balloon b4"></span>
</div>

<div class="wrap">
  <div class="head">
    <p class="ribbon">HAPPY BIRTHDAY</p>
    <h1 id="title">刘雨晴</h1>
    <p class="sub" id="count">读取中…</p>
    <div class="actions">
      <button class="btn-main" id="write">写一张祝福</button>
      <button class="btn-ghost" id="flow">整理成一列</button>
      <button class="btn-ghost" id="rename">改名字</button>
    </div>
  </div>

  <div id="banner"></div>

  <div class="stage" id="board">
    <div class="curtain"></div>
    <div class="dim"></div>
    <div class="streamers" aria-hidden="true">
      <i class="streamer"></i><i class="streamer"></i><i class="streamer"></i><i class="streamer"></i>
      <i class="streamer"></i><i class="streamer"></i><i class="streamer"></i><i class="streamer"></i>
    </div>
  </div>

  <p class="tip" id="tip">按住便签上的图钉，可以拖到幕布上任何位置</p>
</div>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<div class="mask" id="mask">
  <div class="dialog" id="dialogWish">
    <h2>写一张贴上去</h2>
    <p class="hint">贴上去之后，所有打开这个页面的人都会看到。</p>
    <label for="text">想说的话</label>
    <textarea id="text" maxlength="300" placeholder="随便写，一句也够"></textarea>
    <label>便签颜色</label>
    <div class="swatches" id="swatches"></div>
    <label for="name">署名</label>
    <input id="name" maxlength="16" placeholder="你的名字">
    <label class="anon" for="anon">
      <input type="checkbox" id="anon">
      <span>匿名
        <small>只显示"匿名同学"，你填的名字不会被保存。</small>
      </span>
    </label>
    <div class="err" id="err"></div>
    <div class="row">
      <button class="btn-ghost" data-close>再想想</button>
      <button class="btn-main" id="send">贴上去</button>
    </div>
  </div>

  <div class="dialog" id="dialogName" hidden>
    <h2>改名字</h2>
    <p class="hint">标题上的名字，所有人看到的是同一个。</p>
    <label for="whoInput">寿星的名字</label>
    <input id="whoInput" maxlength="12" placeholder="刘雨晴">
    <div class="err" id="err2"></div>
    <div class="row">
      <button class="btn-ghost" data-close>取消</button>
      <button class="btn-main" id="saveName">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const S = window.storage;
const MSG_PREFIX = 'party:note:';
const META_KEY = 'party:meta';
const MINE_KEY = 'party:mine';
const DEFAULT_WHO = '刘雨晴';

const COLORS = [
  { tab:'#FFD26A', glow:'rgba(255,210,106,.55)' },
  { tab:'#FF5FA2', glow:'rgba(255,95,162,.55)' },
  { tab:'#A96BFF', glow:'rgba(169,107,255,.55)' },
  { tab:'#5FD8C4', glow:'rgba(95,216,196,.5)' },
  { tab:'#FF8A5B', glow:'rgba(255,138,91,.5)' }
];

const NOTE_W = 210, NOTE_H = 178, GAP = 20, PAD_TOP = 96, PAD_SIDE = 24;

let notes = [], mine = [], who = DEFAULT_WHO, pickedColor = 0, offline = false;
const $ = id => document.getElementById(id);
const board = $('board');

async function sGet(k, shared){ try{ return await S.get(k, shared); }catch(e){ return null; } }

async function loadMeta(){
  const r = await sGet(META_KEY, true);
  if(r){ try{ who = JSON.parse(r.value).who || DEFAULT_WHO; }catch(e){} }
}
async function loadMine(){
  const r = await sGet(MINE_KEY, false);
  if(r){ try{ mine = JSON.parse(r.value) || []; }catch(e){ mine = []; } }
}
async function loadNotes(){
  let keys = [];
  try{
    const res = await S.list(MSG_PREFIX, true);
    keys = (res && res.keys ? res.keys : []).map(k => typeof k === 'string' ? k : k.key);
  }catch(e){ offline = true; return; }
  const out = [];
  for(let i=0;i<keys.length;i+=6){
    const chunk = await Promise.all(keys.slice(i,i+6).map(async k => {
      const r = await sGet(k, true);
      if(!r) return null;
      try{ return JSON.parse(r.value); }catch(e){ return null; }
    }));
    chunk.forEach(v => { if(v && v.text) out.push(v); });
  }
  out.sort((a,b) => (a.ts||0)-(b.ts||0));
  notes = out;
}
async function saveNote(n){
  try{ const ok = await S.set(MSG_PREFIX + n.id, JSON.stringify(n), true); if(!ok) throw 0; return true; }
  catch(e){ return false; }
}

const isFlow = () => document.body.classList.contains('flow');

function slotFor(i){
  const w = board.clientWidth - PAD_SIDE*2;
  const cols = Math.max(1, Math.floor((w + GAP) / (NOTE_W + GAP)));
  const span = cols > 1 ? (w - NOTE_W)/(cols-1) : 0;
  const jx = ((i*41)%23)-11, jy = ((i*67)%21)-10;
  return {
    x: Math.max(8, PAD_SIDE + (i%cols)*span + jx),
    y: Math.max(24, PAD_TOP + Math.floor(i/cols)*(NOTE_H+GAP) + jy)
  };
}

function sizeBoard(){
  if(isFlow()) return;
  let maxY = 0;
  notes.forEach((n,i) => { const y = n.y != null ? n.y : slotFor(i).y; maxY = Math.max(maxY, y+NOTE_H); });
  board.style.height = Math.max(540, maxY + 44) + 'px';
}

function renderHead(){
  $('title').textContent = who;
  document.title = who + ' · 生日祝福墙';
  const n = notes.length;
  $('count').innerHTML = n === 0 ? '幕布上还空着，第一张归你' : `已经收到 <b>${n}</b> 张祝福`;
}

function buildNote(n,i){
  const el = document.createElement('article');
  el.className = 'note';
  const c = COLORS[n.color] || COLORS[0];
  el.style.setProperty('--tab', c.tab);
  el.style.setProperty('--glow', c.glow);
  el.style.setProperty('--rot', (((i*31)%7)-3) + 'deg');

  const pin = document.createElement('span');
  pin.className = 'pin'; pin.title = '拖动';
  el.appendChild(pin);

  const p = document.createElement('p');
  p.textContent = n.text;
  if(n.text.length > 60) p.className = 'long';
  el.appendChild(p);

  const s = document.createElement('span');
  s.className = 'sign-line';
  s.textContent = '—— ' + (n.anon ? '匿名同学' : (n.name || '一位同学'));
  el.appendChild(s);

  if(mine.includes(n.id)){
    const d = document.createElement('button');
    d.className = 'del'; d.textContent = '取下';
    d.onclick = e => { e.stopPropagation(); removeNote(n.id); };
    el.appendChild(d);
  }

  if(!isFlow()){
    if(n.x == null || n.y == null){ const s2 = slotFor(i); n.x = s2.x; n.y = s2.y; }
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    enableDrag(el, n);
  }
  return el;
}

function renderBoard(){
  board.querySelectorAll('.note,.empty').forEach(e => e.remove());
  if(notes.length === 0){
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '幕布上一张都还没有<br>第一张，写给她';
    board.appendChild(e);
    board.style.height = isFlow() ? 'auto' : '540px';
    return;
  }
  notes.forEach((n,i) => board.appendChild(buildNote(n,i)));
  sizeBoard();
}
function renderAll(){ renderHead(); renderBoard(); }

function enableDrag(el,n){
  const pin = el.querySelector('.pin');
  let sx=0,sy=0,ox=0,oy=0,moved=false;
  const move = e => {
    const dx = e.clientX-sx, dy = e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy) > 3) moved = true;
    n.x = Math.max(2, Math.min(board.clientWidth-NOTE_W-2, ox+dx));
    n.y = Math.max(6, oy+dy);
    el.style.left = n.x+'px'; el.style.top = n.y+'px';
  };
  const up = async () => {
    pin.removeEventListener('pointermove', move);
    pin.removeEventListener('pointerup', up);
    pin.removeEventListener('pointercancel', up);
    el.classList.remove('dragging');
    if(!moved) return;
    sizeBoard();
    if(!await saveNote(n)) toast('位置没保存上');
  };
  pin.addEventListener('pointerdown', e => {
    if(isFlow()) return;
    e.preventDefault();
    sx=e.clientX; sy=e.clientY; ox=n.x; oy=n.y; moved=false;
    el.classList.add('dragging');
    pin.setPointerCapture(e.pointerId);
    pin.addEventListener('pointermove', move);
    pin.addEventListener('pointerup', up);
    pin.addEventListener('pointercancel', up);
  });
}

/* ---------- 纸屑 ---------- */
function burst(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('confetti');
  const palette = ['#FFD26A','#FF5FA2','#A96BFF','#5FD8C4','#FFF3D4','#FF8A5B'];
  for(let i=0;i<44;i++){
    const b = document.createElement('i');
    b.className = 'bit';
    b.style.left = (12 + Math.random()*76) + 'vw';
    b.style.top = '-20px';
    b.style.background = palette[i % palette.length];
    b.style.borderRadius = Math.random() > .6 ? '50%' : '1px';
    b.style.setProperty('--dx', (Math.random()*220-110) + 'px');
    b.style.setProperty('--spin', (Math.random()*900-450) + 'deg');
    b.style.animation = `fall ${2.2 + Math.random()*1.6}s cubic-bezier(.2,.6,.5,1) ${Math.random()*.5}s forwards`;
    box.appendChild(b);
    setTimeout(() => b.remove(), 4800);
  }
}

/* ---------- 动作 ---------- */
async function addNote(text,name,anon,color){
  const id = Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const slot = isFlow() ? {x:null,y:null} : slotFor(notes.length);
  const n = { id, text, name: anon ? '' : name, anon, color, x:slot.x, y:slot.y, ts:Date.now() };
  if(!await saveNote(n)) showBanner('这张暂时没能保存，刷新后可能会不见。');
  notes.push(n); mine.push(id);
  try{ await S.set(MINE_KEY, JSON.stringify(mine), false); }catch(e){}
  renderAll();
  burst();
  toast(anon ? '匿名贴上了' : '贴上了');
}

async function removeNote(id){
  try{ await S.delete(MSG_PREFIX+id, true); }catch(e){}
  notes = notes.filter(n => n.id !== id);
  mine = mine.filter(x => x !== id);
  try{ await S.set(MINE_KEY, JSON.stringify(mine), false); }catch(e){}
  renderAll(); toast('已取下');
}

async function saveWho(v){
  who = v;
  try{ await S.set(META_KEY, JSON.stringify({who}), true); }
  catch(e){ showBanner('名字没保存上，别人看到的可能还是旧的。'); }
  renderHead();
}

function showBanner(m){ $('banner').innerHTML = '<div class="banner">'+m+'</div>'; }
let tT;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),2100); }

COLORS.forEach((c,i) => {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = c.tab; b.style.color = c.tab;
  b.setAttribute('aria-pressed', i===0);
  b.setAttribute('aria-label','便签颜色 '+(i+1));
  b.onclick = () => { pickedColor = i;
    $('swatches').querySelectorAll('.swatch').forEach((s,j)=>s.setAttribute('aria-pressed', j===i)); };
  $('swatches').appendChild(b);
});

function openDialog(w){
  $('mask').classList.add('on');
  $('dialogWish').hidden = w !== 'wish';
  $('dialogName').hidden = w !== 'name';
  setTimeout(()=> (w==='wish' ? $('text') : $('whoInput')).focus(), 50);
}
function closeDialog(){ $('mask').classList.remove('on'); $('err').textContent=''; $('err2').textContent=''; }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeDialog);
$('mask').onclick = e => { if(e.target === $('mask')) closeDialog(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDialog(); });

$('write').onclick = () => openDialog('wish');
$('rename').onclick = () => { $('whoInput').value = who; openDialog('name'); };
$('anon').onchange = e => {
  $('name').disabled = e.target.checked;
  $('name').placeholder = e.target.checked ? '匿名不显示名字' : '你的名字';
};

$('send').onclick = async () => {
  const text = $('text').value.trim();
  const anon = $('anon').checked;
  const name = $('name').value.trim();
  if(!text){ $('err').textContent = '还没写内容。'; return; }
  if(!anon && !name){ $('err').textContent = '填个名字，或者勾匿名。'; return; }
  $('send').disabled = true;
  await addNote(text,name,anon,pickedColor);
  $('send').disabled = false;
  $('text').value = '';
  closeDialog();
};

$('saveName').onclick = async () => {
  const v = $('whoInput').value.trim();
  if(!v){ $('err2').textContent = '填一个名字。'; return; }
  await saveWho(v); closeDialog(); toast('名字已更新');
};

$('flow').onclick = () => {
  const on = document.body.classList.toggle('flow');
  $('flow').textContent = on ? '回到幕布' : '整理成一列';
  $('tip').textContent = on ? '这一列可以直接打印，或存成 PDF' : '按住便签上的图钉，可以拖到幕布上任何位置';
  renderBoard();
};

let rT;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(()=>{ if(!isFlow()) sizeBoard(); },200); });

(async function init(){
  if(window.innerWidth < 620) document.body.classList.add('flow');
  if(!S){ showBanner('这个页面要在 Claude 里打开，才能存下大家的祝福。'); renderAll(); return; }
  await Promise.all([loadMeta(), loadMine()]);
  await loadNotes();
  if(offline) showBanner('便签暂时读不出来，过一会儿刷新试试。');
  if(isFlow()){ $('flow').textContent='回到幕布'; $('tip').textContent='屏幕窄时排成一列，电脑上可以自由拖动'; }
  renderAll();
})();
</script>
